<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Offline — Pet Protocols</title>
  <link rel="icon" href="/icons/favicon-32x32.png" type="image/png">
  <meta name="theme-color" content="#EA580C">
  <style>
    :root {
      --brand: #EA580C;
      --bg: #FAF7F2;
      --card: #FFFFFF;
      --text: #1E293B;
      --muted: #64748B;
      --border: #E2E8F0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --brand: #EA580C;
        --bg: #141518;
        --card: #1E2024;
        --text: #F1F5F9;
        --muted: #94A3B8;
        --border: #2E3238;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 40px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px -15px rgba(0,0,0,0.07);
    }
    .icon-box {
      width: 76px;
      height: 76px;
      margin: 0 auto 24px;
      background: rgba(234, 88, 12, 0.12);
      border: 1px solid rgba(234, 88, 12, 0.25);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--brand);
    }
    .icon-box svg {
      width: 38px;
      height: 38px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(234, 88, 12, 0.1);
      color: var(--brand);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 10px;
      color: var(--text);
      letter-spacing: -0.5px;
    }
    p {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px 20px;
      background: var(--brand);
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 8px 20px -4px rgba(234, 88, 12, 0.35);
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.92; }
    .status {
      font-size: 12px;
      color: var(--muted);
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-box">
      <svg viewBox="0 0 24 24">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <div class="badge">No Connection</div>
    <h1>You're Currently Offline</h1>
    <p>Pet Protocols requires an active internet connection to browse gourmet menus, update your cart, and place orders.</p>
    <button class="btn" onclick="retry()">Retry Connection</button>
    <div class="status" id="status-text">Please check your Wi-Fi or mobile data network.</div>
  </div>

  <script>
    function updateOnlineStatus() {
      const status = document.getElementById('status-text');
      if (navigator.onLine) {
        status.textContent = 'Connection restored! Click retry to return to Pet Protocols.';
        status.style.color = '#10B981';
      } else {
        status.textContent = 'Please check your Wi-Fi or mobile data network.';
        status.style.color = '';
      }
    }
    function retry() {
      if (navigator.onLine) {
        window.location.href = '/';
      } else {
        window.location.reload();
      }
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();
  </script>
</body>
</html>
